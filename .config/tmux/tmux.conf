# Set true color (modern terminal-features mechanism) + undercurl for nvim diagnostics
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -as terminal-features ",*:usstyle"

# OSC 8 hyperlink passthrough (neither xterm-ghostty nor tmux-256color declares
# Hls, so tmux strips hyperlinks unless we force the feature on)
set -as terminal-features ",*:hyperlinks"

# Enable mouse support
set -g mouse on

# Set bindings
bind -n M-H previous-window
bind -n M-L next-window
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g default-shell $SHELL
set-option -g renumber-windows on
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g set-clipboard on          # use system clipboard
setw -g mode-keys vi
set -g focus-events on           # let nvim autoread / vim-tmux-navigator see focus
setw -g aggressive-resize on     # size to smallest attached client, not session

# vi-style copy-mode selection (tmux-yank handles the actual yank)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"


# Open panes in cwd
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

# Continuum and resurrect cfg
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# catppuccin cfg
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

run '~/.tmux/plugins/tpm/tpm'
bind C-l send-keys 'C-l'
